interface:
  display_name: "小红书数据采集分析"
  short_description: "小红书 cookie 注入 + 多关键词采集 / 跨 run 聚合 / 针对性总结"
  default_prompt: "Use $xiaohongshu-harvester to research a 小红书 topic. Required flow: (1) discuss topic boundary with user; (2) design 3-5 research dimensions WITH the user — dimensions are free-form, never from a fixed catalog, each dimension needs 3-8 real community keywords (e.g. skincare uses 烂脸 not 事故); (3) propose 1-3 keyword groups per dimension and let user confirm; (4) run pipeline.py once with --keywords 'k1,k2,k3' (single process, reuses Chromium + cookie singleton — do NOT spawn N separate --keyword invocations unless you need per-keyword --topic/--sort overrides); (5) run cross_analyze.py passing the full dimension definitions via --dimensions 'name:kw1,kw2;name2:kw3,kw4' (the literal --runs slugs must match the --keywords string verbatim), then write a targeted report citing note_id / comment_id and source run for every claim. Requires the user to supply their own login cookie at assets/cookies.json; before any collect call run `python scripts/xhs_client.py whoami` only to confirm cookies parse, then validate by one tiny `pipeline.py --keyword <tiny_term> --pages 1` (whoami itself does NOT hit XHS)."