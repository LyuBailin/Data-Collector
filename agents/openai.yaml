interface:
  display_name: "小红书数据采集分析"
  short_description: "小红书 cookie 注入 + 多关键词采集 / 跨 run 聚合 / 针对性总结"
  default_prompt: "Use $xiaohongshu-harvester to research a 小红书 topic. Required flow: (1) discuss topic boundary with user; (2) design 3-5 research dimensions WITH the user — dimensions are free-form, never from a fixed catalog, each dimension needs 3-8 real community keywords (e.g. skincare uses 烂脸 not 事故); (3) propose 1-3 keyword groups per dimension and let user confirm; (4) run pipeline.py for each keyword group with --topic <slug>; (5) run cross_analyze.py passing the full dimension definitions via --dimensions 'name:kw1,kw2;name2:kw3,kw4', then write a targeted report citing note_id / comment_id and source run for every claim. Requires the user to supply their own login cookie at assets/cookies.json."